name: Book
on:
  schedule:
    - cron: '0 15 * * SUN-THU'
jobs:
  book:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Book my ticket
        env:
          RVK_USERNAME: ${{ secrets.RVK_USERNAME }}
          RVK_PASSWORD: ${{ secrets.RVK_PASSWORD }}
        run: ./bmt.main.kts
      - uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: ./*.png
