name: Book
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * SUN-THU'
jobs:
  book:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Book my ticket
        env:
          RVK_USERNAME: ${{ secrets.RVK_USERNAME }}
          RVK_PASSWORD: ${{ secrets.RVK_PASSWORD }}
        run: ./bmt.main.kts
